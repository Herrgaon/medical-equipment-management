<div class="panel">
  <h1>Mã QR thiết bị</h1>
  <p class="hint-text">Mỗi mã QR khi quét sẽ mở thẳng hồ sơ đúng thiết bị đó. Tick chọn thiết bị cần in rồi bấm "In tem đã chọn".</p>
  <div class="toolbar">
    <button id="qrSelectAllBtn" style="width:auto;">Chọn tất cả</button>
    <button id="qrPrintBtn" style="width:auto;">In tem đã chọn</button>
  </div>
  <div id="qrError" class="error-text"></div>
  <table class="data">
    <thead><tr><th style="width:30px;"></th><th>Mã TB</th><th>Tên thiết bị</th></tr></thead>
    <tbody id="qrListBody"></tbody>
  </table>
</div>
