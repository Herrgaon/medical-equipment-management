  <script>
    // initialDeviceId đến từ query string URL (người dùng/QR có thể chứa giá trị bất kỳ) -> PHẢI
    // dùng scriptlet dạng escape (dấu bằng, không có chấm than) cho 2 dòng dưới đây, không phải
    // dạng raw output. LƯU Ý: không viết ví dụ thẻ scriptlet thật dưới dạng text trong comment ở
    // đây — HtmlService quét toàn file tìm cặp dấu mở/đóng thẻ kiểu văn bản thuần, không hiểu ngữ
    // cảnh comment, nên ví dụ viết thẳng ra sẽ bị hiểu nhầm thành scriptlet rỗng thật và vỡ template.
    var INITIAL_DEVICE_ID = "<?= initialDeviceId ?>";
    var APP_URL = "<?= appUrl ?>";

    var SESSION_STORAGE_KEY = 'qltbyt_session_token';
    var formOptions = null;
    var currentDeviceId = null; // null = đang tạo mới
    var devicePage = 1;
    var deviceTotal = 0;

    function getToken() { return localStorage.getItem(SESSION_STORAGE_KEY); }

    // ---- Điều hướng sidebar ----
    function showView(viewName) {
      document.querySelectorAll('.view').forEach(function (v) { v.style.display = 'none'; });
      var el = document.getElementById('view-' + viewName);
      if (el) el.style.display = '';
    }

    document.querySelectorAll('.navitem').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.navitem').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var view = btn.getAttribute('data-view');
        if (view === 'devices') { showView('devices'); loadDevices(); }
        else if (view === 'dashboard') { showView('dashboard'); loadDashboard(); }
        else if (view === 'admin') { showView('admin'); loadCategoryList(); }
        else if (view === 'qr') { showView('qr'); loadQrList(); }
        else if (view === 'lifecycle') { showView('lifecycle'); openLifecycleStage(btn.getAttribute('data-stage'), btn.getAttribute('data-label')); }
        else if (view === 'warranty') { showView('warranty'); loadWarrantyDeviceOptions(); }
        else if (view === 'techassurance') { showView('techassurance'); openTechAssurance(btn.getAttribute('data-type'), btn.getAttribute('data-label')); }
        else if (view === 'incidentrepair') { showView('incidentrepair'); openIncidentRepairTab(btn.getAttribute('data-label')); }
        else if (view === 'stub') { setText('stubTitle', btn.getAttribute('data-label')); showView('stub'); }
      });
    });
    document.querySelector('.navitem[data-view="dashboard"]').classList.add('active');

    function loadDashboard() {
      google.script.run
        .withSuccessHandler(function (response) {
          if (!response || !response.success) return;
          setText('statTotalDevices', response.data.total);
          setText('statDangSuDung', response.data.dangSuDung);
          setText('statDangTiepNhan', response.data.dangTiepNhan);
          setText('statTamNgung', response.data.tamNgung);
        })
        .withFailureHandler(function () {})
        .getDashboardSummary(getToken());
    }

    function showApp(user) {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('appShell').style.display = 'flex';
      setText('whoName', user.nickname || user.hoTen || user.tenDangNhap);
      setText('whoRole', user.vaiTro || '');
      setText('whoScope', user.khoaPhongPhuTrach ? user.khoaPhongPhuTrach : 'Toàn viện');
      loadFormOptions();
      if (INITIAL_DEVICE_ID) {
        // Mở từ link QR quét vào — mở thẳng chi tiết thiết bị đó thay vì Trang chủ.
        openDeviceDetail(INITIAL_DEVICE_ID);
      } else {
        showView('dashboard');
        loadDashboard();
      }
    }

    function showLogin(errorMessage) {
      document.getElementById('loginCard').style.display = '';
      document.getElementById('appShell').style.display = 'none';
      setText('loginError', errorMessage || '');
    }

    function tryResumeSession() {
      var token = getToken();
      if (!token) { showLogin(); return; }
      google.script.run
        .withSuccessHandler(function (response) {
          if (response && response.success) showApp(response.data);
          else { localStorage.removeItem(SESSION_STORAGE_KEY); showLogin(); }
        })
        .withFailureHandler(function () {
          localStorage.removeItem(SESSION_STORAGE_KEY); showLogin();
        })
        .getCurrentUserInfo(token);
    }

    document.getElementById('loginForm').addEventListener('submit', function (evt) {
      evt.preventDefault();
      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;
      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      setText('loginError', '');
      google.script.run
        .withSuccessHandler(function (response) {
          btn.disabled = false;
          if (response && response.success) {
            localStorage.setItem(SESSION_STORAGE_KEY, response.data.token);
            showApp(response.data.user);
          } else {
            setText('loginError', response && response.error ? response.error.message : 'Đăng nhập thất bại.');
          }
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          setText('loginError', err && err.message ? err.message : String(err));
        })
        .login(email, password);
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
      var token = getToken();
      localStorage.removeItem(SESSION_STORAGE_KEY);
      showLogin();
      if (token) google.script.run.logout(token);
    });

    // ---- Danh mục dùng chung cho filter + form ----
    function fillSelect(selectEl, items, placeholder) {
      selectEl.innerHTML = '';
      var opt0 = document.createElement('option');
      opt0.value = ''; opt0.textContent = placeholder;
      selectEl.appendChild(opt0);
      items.forEach(function (item) {
        var opt = document.createElement('option');
        opt.value = item.ID;
        opt.textContent = item.TEN || item.MA || item.ID;
        selectEl.appendChild(opt);
      });
    }

    function loadFormOptions() {
      google.script.run
        .withSuccessHandler(function (response) {
          if (!response || !response.success) return;
          formOptions = response.data;
          fillSelect(document.getElementById('devFilterKhoaPhong'), formOptions.KHOA_PHONG, 'Tất cả khoa/phòng');
          fillSelect(document.getElementById('devFilterNhom'), formOptions.NHOM_THIET_BI, 'Tất cả nhóm thiết bị');
          fillSelect(document.getElementById('ddLoai'), formOptions.LOAI_THIET_BI, '--');
          fillSelect(document.getElementById('ddNhom'), formOptions.NHOM_THIET_BI, '--');
          fillSelect(document.getElementById('ddHang'), formOptions.HANG_SAN_XUAT, '--');
          fillSelect(document.getElementById('ddNCC'), formOptions.NHA_CUNG_CAP, '--');
          fillSelect(document.getElementById('ddKhoaPhong'), formOptions.KHOA_PHONG, '--');
          fillSelect(document.getElementById('ddViTri'), formOptions.VI_TRI, '--');
          fillSelect(document.getElementById('ddNguoiPhuTrach'), formOptions.NGUOI_PHU_TRACH, '--');
        })
        .withFailureHandler(function (err) { setText('devListError', err && err.message ? err.message : String(err)); })
        .getDeviceFormOptions(getToken());
    }

    // ---- Danh sách thiết bị ----
    function loadDevices() {
      var filter = {
        keyword: document.getElementById('devSearchKeyword').value.trim(),
        khoaPhongId: document.getElementById('devFilterKhoaPhong').value,
        nhomThietBiId: document.getElementById('devFilterNhom').value
      };
      google.script.run
        .withSuccessHandler(function (response) {
          setText('devListError', '');
          if (!response || !response.success) {
            setText('devListError', response && response.error ? response.error.message : 'Không tải được danh sách.');
            return;
          }
          renderDeviceList(response.data);
        })
        .withFailureHandler(function (err) { setText('devListError', err && err.message ? err.message : String(err)); })
        .listDevices(getToken(), filter, devicePage);
    }

    function renderDeviceList(result) {
      deviceTotal = result.total;
      var tbody = document.getElementById('devListBody');
      tbody.innerHTML = '';
      result.items.forEach(function (device) {
        var tr = document.createElement('tr');
        tr.setAttribute('data-id', device.ID);
        var tdMa = document.createElement('td'); tdMa.textContent = device.MA_THIET_BI;
        var tdTen = document.createElement('td'); tdTen.textContent = device.TEN_THIET_BI;
        var tdKhoa = document.createElement('td'); tdKhoa.textContent = lookupLabel('KHOA_PHONG', device.KHOA_PHONG_ID);
        var tdStatus = document.createElement('td');
        var badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = device.TRANG_THAI_QUAN_LY;
        tdStatus.appendChild(badge);
        tr.appendChild(tdMa); tr.appendChild(tdTen); tr.appendChild(tdKhoa); tr.appendChild(tdStatus);
        tr.addEventListener('click', function () { openDeviceDetail(device.ID); });
        tbody.appendChild(tr);
      });
      var totalPages = Math.max(1, Math.ceil(deviceTotal / 20));
      setText('devPageInfo', 'Trang ' + devicePage + '/' + totalPages + ' — ' + deviceTotal + ' thiết bị');
    }

    function lookupLabel(categoryKey, id) {
      if (!formOptions || !formOptions[categoryKey] || !id) return '';
      var found = formOptions[categoryKey].filter(function (i) { return i.ID === id; })[0];
      return found ? (found.TEN || found.MA || '') : '';
    }

    document.getElementById('devSearchBtn').addEventListener('click', function () { devicePage = 1; loadDevices(); });
    document.getElementById('devFilterKhoaPhong').addEventListener('change', function () { devicePage = 1; loadDevices(); });
    document.getElementById('devFilterNhom').addEventListener('change', function () { devicePage = 1; loadDevices(); });
    document.getElementById('devPrevBtn').addEventListener('click', function () { if (devicePage > 1) { devicePage--; loadDevices(); } });
    document.getElementById('devNextBtn').addEventListener('click', function () {
      if (devicePage * 20 < deviceTotal) { devicePage++; loadDevices(); }
    });
    document.getElementById('devNewBtn').addEventListener('click', function () { openDeviceDetail(null); });
    document.getElementById('devBackBtn').addEventListener('click', function () { showView('devices'); loadDevices(); });
    document.getElementById('devImportBtn').addEventListener('click', function () { showView('import'); resetImportUI(); });
    document.getElementById('importBackBtn').addEventListener('click', function () { showView('devices'); loadDevices(); });

    // ---- Chi tiết / form thiết bị ----
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
        btn.classList.add('active');
        document.querySelector('[data-tab-panel="' + btn.getAttribute('data-tab') + '"]').classList.add('active');
      });
    });

    function clearDeviceForm() {
      ['ddTenThietBi', 'ddNuoc', 'ddModel', 'ddSerial', 'ddNamSX', 'ddHinhThuc', 'ddNgayDua', 'ddBaoHanhBD', 'ddBaoHanhKT']
        .forEach(function (id) { document.getElementById(id).value = ''; });
      ['ddLoai', 'ddNhom', 'ddHang', 'ddNCC', 'ddKhoaPhong', 'ddViTri', 'ddNguoiPhuTrach', 'ddPhanLoai'].forEach(function (id) { document.getElementById(id).value = ''; });
      document.getElementById('ddTinhTrang').value = 'Chưa xác định';
    }

    function fillDeviceForm(device) {
      document.getElementById('ddTenThietBi').value = device.TEN_THIET_BI || '';
      document.getElementById('ddLoai').value = device.LOAI_THIET_BI_ID || '';
      document.getElementById('ddNhom').value = device.NHOM_THIET_BI_ID || '';
      document.getElementById('ddHang').value = device.HANG_SAN_XUAT_ID || '';
      document.getElementById('ddNuoc').value = device.NUOC_SAN_XUAT || '';
      document.getElementById('ddModel').value = device.MODEL || '';
      document.getElementById('ddSerial').value = device.SERIAL || '';
      document.getElementById('ddNamSX').value = device.NAM_SAN_XUAT || '';
      document.getElementById('ddPhanLoai').value = device.PHAN_LOAI || '';
      document.getElementById('ddNCC').value = device.NHA_CUNG_CAP_ID || '';
      document.getElementById('ddKhoaPhong').value = device.KHOA_PHONG_ID || '';
      document.getElementById('ddViTri').value = device.VI_TRI_ID || '';
      document.getElementById('ddNguoiPhuTrach').value = device.NGUOI_PHU_TRACH_ID || '';
      document.getElementById('ddTinhTrang').value = device.TINH_TRANG_KY_THUAT || 'Chưa xác định';
      document.getElementById('ddHinhThuc').value = device.HINH_THUC_MUA_SAM || '';
      document.getElementById('ddNgayDua').value = (device.NGAY_DUA_VAO_SU_DUNG || '').toString().slice(0, 10);
      document.getElementById('ddBaoHanhBD').value = (device.NGAY_BAT_DAU_BAO_HANH || '').toString().slice(0, 10);
      document.getElementById('ddBaoHanhKT').value = (device.NGAY_HET_BAO_HANH || '').toString().slice(0, 10);
    }

    function deviceDeepLink(deviceId) {
      return APP_URL + (APP_URL.indexOf('?') === -1 ? '?' : '&') + 'device=' + encodeURIComponent(deviceId);
    }

    /**
     * In tem QR hàng loạt: vẽ QR vào các div ẩn tạm, đọc trực tiếp <canvas> (đồng bộ — chỉ phần
     * ảnh <img> hiển thị của thư viện là bất đồng bộ, không cần dùng ở đây), rồi ghép thành 1 cửa
     * sổ in riêng — tránh phải nhúng lại toàn bộ thư viện QR vào cửa sổ mới.
     */
    function openPrintWindow(items) {
      var tempHolder = document.createElement('div');
      tempHolder.style.position = 'absolute';
      tempHolder.style.left = '-9999px';
      document.body.appendChild(tempHolder);

      var labelsHtml = items.map(function (item) {
        var tempDiv = document.createElement('div');
        tempHolder.appendChild(tempDiv);
        new QRCode(tempDiv, { text: deviceDeepLink(item.id), width: 150, height: 150 });
        var dataUrl = tempDiv.querySelector('canvas').toDataURL('image/png');
        return '<div class="qr-label"><img src="' + dataUrl + '"><div>' + escapeHtml(item.ma) + '</div><div>' + escapeHtml(item.ten) + '</div></div>';
      }).join('');

      document.body.removeChild(tempHolder);

      var printWin = window.open('', '_blank');
      printWin.document.write(
        '<!DOCTYPE html><html><head><meta charset="utf-8"><title>In tem QR</title><style>' +
        'body{font-family:sans-serif;} .qr-label{display:inline-block;width:170px;text-align:center;margin:8px;padding:8px;border:1px solid #ccc;font-size:12px;} .qr-label img{width:130px;height:130px;}' +
        '</style></head><body>' + labelsHtml + '<script>window.onload=function(){window.print();};<\/script></body></html>'
      );
      printWin.document.close();
    }

    function escapeHtml(s) {
      var div = document.createElement('div');
      div.textContent = s || '';
      return div.innerHTML;
    }

    function renderDeviceQr(deviceId) {
      var box = document.getElementById('ddQrBox');
      var container = document.getElementById('ddQrContainer');
      container.innerHTML = '';
      if (!deviceId || !APP_URL) { box.style.display = 'none'; return; }
      box.style.display = '';
      new QRCode(container, { text: deviceDeepLink(deviceId), width: 110, height: 110 });
    }

    var currentDeviceData = null;

    function openDeviceDetail(deviceId) {
      currentDeviceId = deviceId;
      currentDeviceData = null;
      setText('devDetailError', '');
      showView('device-detail');
      renderDeviceQr(deviceId);
      if (!deviceId) {
        setText('ddTitle', 'Thiết bị mới');
        clearDeviceForm();
        return;
      }
      setText('ddTitle', 'Đang tải...');
      google.script.run
        .withSuccessHandler(function (response) {
          if (!response || !response.success) {
            setText('devDetailError', response && response.error ? response.error.message : 'Không tải được thiết bị.');
            return;
          }
          currentDeviceData = response.data;
          setText('ddTitle', response.data.TEN_THIET_BI + ' (' + response.data.MA_THIET_BI + ')');
          fillDeviceForm(response.data);
        })
        .withFailureHandler(function (err) { setText('devDetailError', err && err.message ? err.message : String(err)); })
        .getDeviceDetail(getToken(), deviceId);
    }

    document.getElementById('ddQrPrintBtn').addEventListener('click', function () {
      if (!currentDeviceId || !currentDeviceData) return;
      openPrintWindow([{ id: currentDeviceId, ma: currentDeviceData.MA_THIET_BI, ten: currentDeviceData.TEN_THIET_BI }]);
    });

    function readDeviceForm() {
      return {
        TEN_THIET_BI: document.getElementById('ddTenThietBi').value.trim(),
        LOAI_THIET_BI_ID: document.getElementById('ddLoai').value,
        NHOM_THIET_BI_ID: document.getElementById('ddNhom').value,
        HANG_SAN_XUAT_ID: document.getElementById('ddHang').value,
        NUOC_SAN_XUAT: document.getElementById('ddNuoc').value.trim(),
        MODEL: document.getElementById('ddModel').value.trim(),
        SERIAL: document.getElementById('ddSerial').value.trim(),
        NAM_SAN_XUAT: document.getElementById('ddNamSX').value,
        PHAN_LOAI: document.getElementById('ddPhanLoai').value,
        NHA_CUNG_CAP_ID: document.getElementById('ddNCC').value,
        KHOA_PHONG_ID: document.getElementById('ddKhoaPhong').value,
        VI_TRI_ID: document.getElementById('ddViTri').value,
        NGUOI_PHU_TRACH_ID: document.getElementById('ddNguoiPhuTrach').value,
        TINH_TRANG_KY_THUAT: document.getElementById('ddTinhTrang').value,
        HINH_THUC_MUA_SAM: document.getElementById('ddHinhThuc').value.trim(),
        NGAY_DUA_VAO_SU_DUNG: document.getElementById('ddNgayDua').value,
        NGAY_BAT_DAU_BAO_HANH: document.getElementById('ddBaoHanhBD').value,
        NGAY_HET_BAO_HANH: document.getElementById('ddBaoHanhKT').value
      };
    }

    document.getElementById('devSaveBtn').addEventListener('click', function () {
      var data = readDeviceForm();
      var btn = document.getElementById('devSaveBtn');
      btn.disabled = true;
      setText('devDetailError', '');
      var onDone = function (response) {
        btn.disabled = false;
        if (!response || !response.success) {
          setText('devDetailError', response && response.error ? response.error.message : 'Lưu thất bại.');
          return;
        }
        showView('devices');
        loadDevices();
      };
      var onFail = function (err) { btn.disabled = false; setText('devDetailError', err && err.message ? err.message : String(err)); };

      if (currentDeviceId) {
        google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).updateDevice(getToken(), currentDeviceId, data);
      } else {
        google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).createDevice(getToken(), data);
      }
    });

    // ================= Vòng đời hình thành (Tiếp nhận/Nghiệm thu/Bàn giao) =================
    var currentLifecycleStage = null;

    function openLifecycleStage(stage, label) {
      currentLifecycleStage = stage;
      setText('lcTitle', label);
      setText('lcError', '');
      ['lcFormReceipt', 'lcFormAcceptance', 'lcFormHandover'].forEach(function (id) { document.getElementById(id).style.display = 'none'; });
      document.getElementById('lcConfirmSection').style.display = 'none';
      document.getElementById('lcDeviceSelect').parentElement.style.display = '';

      if (stage === 'RECEIPT') document.getElementById('lcFormReceipt').style.display = '';
      else if (stage === 'ACCEPTANCE') document.getElementById('lcFormAcceptance').style.display = '';
      else if (stage === 'HANDOVER_CREATE') {

    function fileToBase64(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var result = reader.result; // "data:...;base64,XXXX"
          resolve(result.substring(result.indexOf(',') + 1));
        };
        reader.onerror = function () { reject(reader.error); };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('importUploadBtn').addEventListener('click', function () {
      var fileInput = document.getElementById('importFileInput');

      setText('importError', '');

      fileToBase64(file).then(function (base64Data) {
        google.script.run
          .withSuccessHandler(function (response) {
            btn.disabled = false;

              setText('importError', response && response.error ? response.error.message : 'Xử lý file thất bại.');
              return;

          })
          .withFailureHandler(function (err) { btn.disabled = false; setText('importError', err && err.message ? err.message : String(err)); })
          .previewExcel(getToken(), base64Data, file.name);
      }).catch(function (err) {
        btn.disabled = false;
        setText('importError', 'Không đọc được file: ' + err);
      });

      var items = qrDeviceList.filter(function (d) { return selectedIds.indexOf(d.ID) !== -1; })
        .map(function (d) { return { id: d.ID, ma: d.MA_THIET_BI, ten: d.TEN_THIET_BI }; });
      openPrintWindow(items);
    });

    // ---- Audit log ----
    function loadAuditLog() {
      google.script.run
        .withSuccessHandler(function (response) {
          setText('auditError', '');
          if (!response || !response.success) { setText('auditError', response && response.error ? response.error.message : 'Lỗi tải audit log.'); return; }
          auditTotal = response.data.total;
          var tbody = document.getElementById('auditListBody');
          tbody.innerHTML = '';
          response.data.items.forEach(function (log) {
            var tr = document.createElement('tr');
            ['THOI_GIAN', 'NGUOI_THUC_HIEN', 'HANH_DONG', 'DOI_TUONG_LOAI', 'DOI_TUONG_ID'].forEach(function (f) {
              var td = document.createElement('td'); td.textContent = log[f]; tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          var totalPages = Math.max(1, Math.ceil(auditTotal / 30));
          setText('auditPageInfo', 'Trang ' + auditPage + '/' + totalPages);
        })
        .withFailureHandler(function (err) { setText('auditError', err && err.message ? err.message : String(err)); })
        .getAuditLog(getToken(), auditPage);
    }
    document.getElementById('auditPrevBtn').addEventListener('click', function () { if (auditPage > 1) { auditPage--; loadAuditLog(); } });
    document.getElementById('auditNextBtn').addEventListener('click', function () { if (auditPage * 30 < auditTotal) { auditPage++; loadAuditLog(); } });

    callServer('ping', function () {}, function () {});
    tryResumeSession();
  </script>
</body>
</html>
